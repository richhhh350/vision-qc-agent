[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-qc-agent"
version = "2.0.0"
description = "Local visual quality inspection with calibrated routing and active learning"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "Pillow>=10.4,<13",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
  "streamlit>=1.40,<2", "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
plots = ["matplotlib>=3.8,<4"]
onnx = ["torch>=2.4", "onnx>=1.17", "onnxruntime>=1.20"]
deep = ["anomalib==2.2.0", "torch==2.12.1", "torchvision==0.27.1", "timm==1.0.30", "psutil>=6,<8"]

[project.scripts]
vision-qc = "vision_qc.cli:main"
vision-qc-v2 = "vision_qc.v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

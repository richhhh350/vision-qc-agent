name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run statistical, data isolation and service tests
        run: python -m pytest -q
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Build package
        run: python -m pip wheel . --no-deps --wheel-dir dist

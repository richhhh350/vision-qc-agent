name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run statistical, data isolation and service tests
        run: python -m pytest -q
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Build package
        run: python -m pip wheel . --no-deps --wheel-dir dist

  deep-contract:
    name: Deep CPU contracts / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned deep backends
        run: python -m pip install -e ".[dev,deep]"
      - name: Check offline architecture and serialization contracts
        env:
          QC_RUN_DEEP_TESTS: '1'
        run: python -m pytest tests/test_v2.py tests/test_v2_deep.py -q
